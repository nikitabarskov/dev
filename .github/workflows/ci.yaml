permissions: {}

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/**
      - container-images/**
      - infrastructure/**
      - justfile
      - mise.toml
      - mise.lock
  pull_request:
    paths:
      - .github/workflows/**
      - container-images/**
      - infrastructure/**
      - justfile
      - mise.toml
      - mise.lock

jobs:
  infrastructure-opentofu:
    needs: setup
    if: ${{ needs.setup.outputs.infrastructure-opentofu == 'true' }}
    uses: ./.github/workflows/infrastructure-opentofu.yaml
    permissions:
      contents: read
      packages: read
    with:
      working-directory: infrastructure/opentofu
  setup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
      infrastructure-opentofu:
        ${{ steps.build-matrix.outputs.infrastructure-opentofu }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            shared:
              - .github/workflows/ci.yaml
              - .github/workflows/container-images.yaml
              - justfile
              - mise.toml
              - mise.lock
            base-ci:
              - container-images/base-ci.Dockerfile
            spacelift-runner:
              - container-images/spacelift-runner.Dockerfile
            infrastructure-opentofu:
              - .github/workflows/infrastructure-opentofu.yaml
              - infrastructure/**
      - id: build-matrix
        run: |
          targets=()
          shared="${STEPS_FILTER_OUTPUTS_SHARED}"
          for target in base-ci spacelift-runner; do
            changed=$(echo "$STEPS_FILTER_OUTPUTS_JSON" | jq -r --arg t "$target" '.[$t]')
            if [[ "$shared" == "true" || "$changed" == "true" ]]; then
              targets+=("\"$target\"")
            fi
          done
          if [[ ${#targets[@]} -eq 0 ]]; then
            matrix='{"target":[]}'
          else
            joined=$(IFS=,; echo "${targets[*]}")
            matrix="{\"target\":[$joined]}"
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          infra="${STEPS_FILTER_OUTPUTS_INFRASTRUCTURE_OPENTOFU}"
          if [[ "$shared" == "true" || "$infra" == "true" ]]; then
            echo "infrastructure-opentofu=true" >> "$GITHUB_OUTPUT"
          else
            echo "infrastructure-opentofu=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          STEPS_FILTER_OUTPUTS_JSON: ${{ toJSON(steps.filter.outputs) }}
          STEPS_FILTER_OUTPUTS_SHARED: ${{ steps.filter.outputs.shared }}
          STEPS_FILTER_OUTPUTS_INFRASTRUCTURE_OPENTOFU:
            ${{ steps.filter.outputs.infrastructure-opentofu }}
  container-images:
    needs: setup
    if: ${{ needs.setup.outputs.matrix != '{"target":[]}' }}
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: ./.github/workflows/container-images.yaml
    permissions:
      contents: read
      packages: write
    with:
      working-directory: container-images
      target: ${{ matrix.target }}
