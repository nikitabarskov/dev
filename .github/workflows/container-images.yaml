on:
  workflow_call:
    inputs:
      working-directory:
        description: "Working directory"
        required: true
        type: string
      target:
        description: "Image to build"
        required: true
        type: string

jobs:
  main:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - if: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}
        run: |
          just \
          docker_build_args="--cache-from type=gha --cache-to type=gha,mode=max" \
          ci ${INPUTS_TARGET}
        env:
          INPUTS_TARGET: ${{ inputs.target }}
      - if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${GITHUB_ACTOR} --password-stdin
          just \
          docker_build_args="--push --cache-from type=gha --cache-to type=gha,mode=max" \
          ci ${INPUTS_TARGET}
        env:
          INPUTS_TARGET: ${{ inputs.target }}
